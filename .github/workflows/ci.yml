name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  release:
    name: Release
    # Only when a version tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: Scripts/build-release.sh --version "${GITHUB_REF_NAME#v}" --zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pdf-ocr-macos-universal.tar.gz
            dist/PDFOCR-macos.zip
          generate_release_notes: true